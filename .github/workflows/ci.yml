name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    name: Import & test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Install fontconfig
        run: apt-get update && apt-get install -y --no-install-recommends libfontconfig1

      - name: Reimport assets
        run: godot --headless --path . --import

      - name: Run gdUnit4 test suite
        run: godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd -a tests/ --ignoreHeadlessMode

  export-linux:
    name: Export Linux binary
    needs: test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Install fontconfig
        run: apt-get update && apt-get install -y --no-install-recommends libfontconfig1

      - name: Reimport assets
        run: godot --headless --path . --import

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -r "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          else
            curl -sL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/templates.tpz -d /tmp
            mv /tmp/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

      - name: Export Linux/X11 release
        run: |
          mkdir -v -p build
          # Godot's headless editor is known to segfault during shutdown
          # *after* a successful export (savepack completes, then it crashes
          # tearing down XR/editor-settings state on exit). Don't trust the
          # exit code — verify the output files landed instead.
          godot --headless --path . --export-release "Linux/X11" build/callsign.x86_64 || true
          test -s build/callsign.x86_64
          test -s build/callsign.pck

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: callsign-linux-x86_64
          path: build/
          if-no-files-found: error
